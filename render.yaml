services:
  - type: worker
    name: community-discord-bot
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: community-bot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: NODE_VERSION
        value: 22.12.0
