name: Node.js checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Install dependencies
        run: npm install
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
