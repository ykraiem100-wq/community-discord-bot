name: DOS Community Bot CI

on:
  push:
    branches: [feature/direct-png-images]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Package source ZIP
        run: git archive --format=zip --output=DOS-COMMUNITY-Nowhost.zip HEAD
      - name: Upload ready-to-download ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DOS-COMMUNITY-Nowhost
          path: DOS-COMMUNITY-Nowhost.zip
          retention-days: 14
